name: Publish v0.5.1

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v0.5.1.yml
      - release-assets/PUSE-PSP-v0.5.1.zip
      - release-assets/v0.5.1.md

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.5.1 >/dev/null 2>&1; then
            gh release upload v0.5.1 release-assets/PUSE-PSP-v0.5.1.zip --clobber
            gh release edit v0.5.1 --notes-file release-assets/v0.5.1.md
          else
            gh release create v0.5.1 \
              release-assets/PUSE-PSP-v0.5.1.zip \
              --title "PUSE-PSP v0.5.1" \
              --notes-file release-assets/v0.5.1.md \
              --prerelease
          fi
